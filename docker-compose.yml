services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_AI_MODE: live
        VITE_API_BASE_URL: http://backend:8787
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.server
    ports:
      - "8787:8787"
